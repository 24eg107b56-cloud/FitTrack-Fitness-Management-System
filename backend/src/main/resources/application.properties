# ==========================================
# FitTrack Application Configuration
# ==========================================
server.port=${PORT:8080}
spring.application.name=FitTrack-Backend

# ==========================================
# Database Configuration
# Supports both MySQL and in-memory H2.
# When SPRING_DATASOURCE_URL is provided (or configured in Render/Docker),
# it connects to MySQL. Otherwise, it gracefully defaults to H2 for instant trial.
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:fittrack_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Enable H2 console for easy browser inspection at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

