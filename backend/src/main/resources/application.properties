# ==========================================
# FitTrack Application Configuration
# ==========================================
server.port=8080

# Application Name
spring.application.name=FitTrack-Backend

# ==========================================
# Primary Database: MySQL Configuration
# ==========================================
# Configure your MySQL credentials here:
spring.datasource.url=jdbc:mysql://localhost:3306/fittrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Optional: In-Memory H2 Database Fallback
# (Uncomment below to run without MySQL installed)
# ==========================================
# spring.datasource.url=jdbc:h2:mem:fittrack_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
